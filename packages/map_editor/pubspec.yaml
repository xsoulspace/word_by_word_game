name: map_editor
description: A new Flutter package project.
version: 0.0.1
publish_to: none

# publish_to: "none"
# homepage:
environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  animate_do: ^5.1.0
  bloc: ^9.2.1
  blur: ^4.0.2
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  # ^11.0.2 pins win32 ^5.9.0, conflicting with package_info_plus ^10
  # (win32 ^6.0.1); file_picker 12.x drops the win32 pin entirely.
  file_picker: ^12.1.0
  firebase_analytics: ^12.4.5
  firebase_analytics_web: ^0.6.1+11
  firebase_core: ^4.12.1
  firebase_core_web: ^3.9.1
  firebase_crashlytics: ^5.2.6
  flame: ^1.38.0
  flame_bloc: ^1.12.24
  flame_fire_atlas: ^1.8.18
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_portal: ^1.1.4
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  from_json_to_json: ^0.5.0
  gap: ^3.0.1
  google_fonts: ^8.2.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  life_hooks: ^0.3.0
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  recase: ^4.1.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  tiled: ^0.11.1
  universal_io: ^2.3.1
  url_launcher: ^6.3.2
  wbw_core:
  wbw_locale:
  wbw_ui_kit:
  xsoulspace_foundation: ^0.4.0
  xsoulspace_ui_foundation: ^0.3.1
dev_dependencies:
  # ^14.1.0 conflicts with freezed ^3.2.5 (needs analyzer >=9 <11) and Flutter
  # bundles a Dart 3.13.0 beta that freezed 4.x rejects; dev-only pin.
  analyzer: ^10.0.0
  build_runner: ^2.15.1
  flutter_gen: ^5.15.0
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  lints: ^6.1.0
  xsoulspace_lints: ^0.1.2

flutter_gen:
  output: lib/generated/

  assets:
    enabled: true
    outputs:
      directory_path_enabled: true
      package_parameter_enabled: false

  integrations:
    image: true
    flutter_svg: true
    rive: false

  fonts:
    enabled: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  generate: false
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/preview/
    - assets/images/preview/colourful/
    - assets/images/preview/white_black/
    - assets/images/preview/evening/
    - assets/images/tilesets/
    - assets/images/tilesets/white_black/
    - assets/images/tilesets/evening/
    - assets/images/cursors/
    - assets/images/cursors/cursor/
# To add assets to your package, add an assets section, like this:
# assets:
#   - images/a_dot_burr.jpeg
#   - images/a_dot_ham.jpeg
#
# For details regarding assets in packages, see
# https://flutter.dev/assets-and-images/#from-packages
#
# An image asset can refer to one or more resolution-specific "variants", see
# https://flutter.dev/assets-and-images/#resolution-aware
# To add custom fonts to your package, add a fonts section here,
# in this "flutter" section. Each entry in this list should have a
# "family" key with the font family name, and a "fonts" key with a
# list giving the asset and other descriptors for the font. For
# example:
# fonts:
#   - family: Schyler
#     fonts:
#       - asset: fonts/Schyler-Regular.ttf
#       - asset: fonts/Schyler-Italic.ttf
#         style: italic
#   - family: Trajan Pro
#     fonts:
#       - asset: fonts/TrajanPro.ttf
#       - asset: fonts/TrajanPro_Bold.ttf
#         weight: 700
#
# For details regarding fonts in packages, see
# https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true
