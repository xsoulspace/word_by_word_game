dependency_overrides:
  # oka_web's dependency; oka_core is not yet published on pub.dev (ADR-0016
  # setup: local path resolution until the release train publishes it).
  oka_core:
    path: ../../oka/packages/oka_core
  # life_hooks 0.3.0 (latest published) pins xsoulspace_foundation ^0.3.0;
  # 0.4.0 is additive (new LocalDbI.clearKey/clear only), so the local 0.4.0
  # checkout satisfies the workspace-wide ^0.4.0 bump.
  xsoulspace_foundation:
    path: ../dart_flutter_packages/pkgs/xsoulspace_foundation
  universal_storage_filesystem:
    path: ../dart_flutter_packages/pkgs/universal_storage_filesystem
  universal_storage_local_db:
    path: ../dart_flutter_packages/pkgs/universal_storage_local_db
  universal_storage_interface:
    path: ../dart_flutter_packages/pkgs/universal_storage_interface
  universal_storage_sync:
    path: ../dart_flutter_packages/pkgs/universal_storage_sync
  universal_storage_sync_utils:
    path: ../dart_flutter_packages/pkgs/universal_storage_sync_utils
  # Published 0.3.1 pins xsoulspace_foundation ^0.3.0, conflicting with the
  # workspace-wide ^0.4.0 bump; the local checkout already depends on ^0.4.0.
  xsoulspace_ui_foundation:
    path: ../dart_flutter_packages/pkgs/xsoulspace_ui_foundation
